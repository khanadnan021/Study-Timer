<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullscreen Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #050507;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --accent: #22c55e;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'JetBrains Mono', monospace;
      --font-sans: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      transition: background-color 0.3s ease;
    }

    /* Ambient Background Glow */
    .glow-bg {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      transition: all 0.5s ease;
    }

    body.active .glow-bg {
      background: radial-gradient(circle, rgba(34, 197, 94, 0.14) 0%, rgba(0, 0, 0, 0) 70%);
      transform: translate(-50%, -50%) scale(1.1);
    }

    body.finished .glow-bg {
      background: radial-gradient(circle, rgba(239, 68, 68, 0.22) 0%, rgba(0, 0, 0, 0) 70%);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: translate(-50%, -50%) scale(1); }
      100% { transform: translate(-50%, -50%) scale(1.25); }
    }

    .container {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 950px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    /* Header / Quick Presets */
    .presets {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .preset-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .preset-btn:hover {
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.25);
      background: rgba(255, 255, 255, 0.08);
    }

    .preset-btn.active-preset {
      color: #fff;
      background: rgba(99, 102, 241, 0.3);
      border-color: var(--primary);
    }

    /* Timer Display */
    .timer-wrapper {
      position: relative;
      margin: 1.5rem 0 2.5rem 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-display {
      font-family: var(--font-mono);
      font-size: clamp(4.5rem, 16vw, 12rem);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .time-part {
      cursor: pointer;
      padding: 0 0.15em;
      border-radius: 12px;
      transition: background 0.2s ease, color 0.2s ease;
      position: relative;
    }

    .time-part:hover:not(.running) {
      background: rgba(255, 255, 255, 0.06);
      color: #a5b4fc;
    }

    .colon {
      opacity: 0.8;
      margin: 0 -0.05em;
      animation: blink 1s step-start infinite;
    }

    .colon.paused {
      animation: none;
    }

    @keyframes blink {
      50% { opacity: 0.2; }
    }

    /* Edit Inputs Overlay */
    .edit-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .edit-modal.open {
      display: flex;
    }

    .modal-content {
      background: #111116;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2rem;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      width: 90%;
      max-width: 420px;
    }

    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #fff;
    }

    .inputs-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 1.8rem;
    }

    .num-input {
      width: 72px;
      height: 60px;
      background: #1a1a24;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #fff;
      font-family: var(--font-mono);
      font-size: 1.8rem;
      text-align: center;
      outline: none;
    }

    .num-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
    }

    .input-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-align: center;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
    }

    .btn-apply {
      flex: 1;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-cancel {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 0.8rem;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* Main Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.9rem 2.2rem;
      font-size: 1.15rem;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
    }

    .btn-start {
      background: #ffffff;
      color: #09090b;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.15);
    }

    .btn-start:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-pause {
      background: #f59e0b;
      color: #000;
    }

    .btn-pause:hover {
      background: #d97706;
    }

    .btn-reset {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-reset:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .btn-icon {
      padding: 0.9rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.15);
    }

    /* Shortcuts & Helper Info */
    .shortcuts {
      margin-top: 3.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      color: #64748b;
      font-size: 0.88rem;
    }

    .shortcuts-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .key-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 2px 7px;
      border-radius: 5px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-right: 4px;
    }

    /* Sound / Alert Notification Banner */
    .alert-banner {
      position: fixed;
      top: 24px;
      background: rgba(239, 68, 68, 0.9);
      color: white;
      padding: 0.8rem 1.6rem;
      border-radius: 12px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
      transform: translateY(-150%);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 200;
    }

    .alert-banner.show {
      transform: translateY(0);
    }

    /* Fullscreen Mode Cleanups */
    :fullscreen {
      background: #000000;
    }
    :fullscreen .presets, :fullscreen .shortcuts {
      opacity: 0.2;
      transition: opacity 0.3s;
    }
    :fullscreen:hover .presets, :fullscreen:hover .shortcuts {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="glow-bg"></div>

  <div id="alertBanner" class="alert-banner">⏰ Time's Up! Study Session Finished!</div>

  <div class="container">
    <!-- Presets -->
    <div class="presets">
      <button class="preset-btn" onclick="setPreset(5)">5 Min</button>
      <button class="preset-btn" onclick="setPreset(15)">15 Min</button>
      <button class="preset-btn active-preset" onclick="setPreset(25)">25 Min (Pomodoro)</button>
      <button class="preset-btn" onclick="setPreset(45)">45 Min</button>
      <button class="preset-btn" onclick="setPreset(60)">60 Min</button>
      <button class="preset-btn" onclick="openEditModal()">⚙️ Custom Time</button>
    </div>

    <!-- Countdown Timer -->
    <div class="timer-wrapper">
      <div class="timer-display" id="timerDisplay" title="Click to edit time">
        <span class="time-part" id="hoursPart" onclick="openEditModal()">00</span>
        <span class="colon" id="colon1">:</span>
        <span class="time-part" id="minutesPart" onclick="openEditModal()">25</span>
        <span class="colon" id="colon2">:</span>
        <span class="time-part" id="secondsPart" onclick="openEditModal()">00</span>
      </div>
    </div>

    <!-- Action Buttons -->
    <div class="controls">
      <button id="startBtn" class="btn btn-start" onclick="toggleTimer()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Start</span>
      </button>

      <button class="btn btn-reset" onclick="resetTimer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        <span>Reset</span>
      </button>

      <button class="btn-icon" title="Toggle Fullscreen (F)" onclick="toggleFullscreen()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>

      <button class="btn-icon" id="soundToggleBtn" title="Toggle Sound" onclick="toggleSound()">
        <svg id="soundIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>

    <!-- Keyboard Shortcuts Guide -->
    <div class="shortcuts">
      <div class="shortcuts-row">
        <div><span class="key-badge">Space</span> Start / Pause</div>
        <div><span class="key-badge">R</span> Reset</div>
        <div><span class="key-badge">F</span> Fullscreen</div>
        <div><span class="key-badge">E</span> Custom Time</div>
      </div>
    </div>
  </div>

  <!-- Custom Edit Modal -->
  <div class="edit-modal" id="editModal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-title">Set Custom Timer</div>
      <div class="inputs-row">
        <div>
          <input type="number" id="inHours" class="num-input" min="0" max="99" value="00">
          <div class="input-label">Hours</div>
        </div>
        <span>:</span>
        <div>
          <input type="number" id="inMinutes" class="num-input" min="0" max="59" value="25">
          <div class="input-label">Minutes</div>
        </div>
        <span>:</span>
        <div>
          <input type="number" id="inSeconds" class="num-input" min="0" max="59" value="00">
          <div class="input-label">Seconds</div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeEditModal()">Cancel</button>
        <button class="btn-apply" onclick="saveCustomTime()">Set Timer</button>
      </div>
    </div>
  </div>

  <script>
    let initialTotalSeconds = 25 * 60;
    let remainingSeconds = 25 * 60;
    let timerInterval = null;
    let isRunning = false;
    let soundEnabled = true;

    // Web Audio Beep API for clean sound without external files
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playBeep(freq = 587.33, duration = 0.25, type = 'sine') {
      if (!soundEnabled) return;
      try {
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {
        console.error(e);
      }
    }

    function playFinishAlarm() {
      if (!soundEnabled) return;
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 0.35, 'triangle'), idx * 180);
      });
      setTimeout(() => {
        notes.forEach((freq, idx) => {
          setTimeout(() => playBeep(freq, 0.4, 'triangle'), idx * 180);
        });
      }, 900);
    }

    function formatNumber(num) {
      return String(num).padStart(2, '0');
    }

    function updateDisplay() {
      const hrs = Math.floor(remainingSeconds / 3600);
      const mins = Math.floor((remainingSeconds % 3600) / 60);
      const secs = remainingSeconds % 60;

      const hrsPart = document.getElementById('hoursPart');
      const colon1 = document.getElementById('colon1');

      if (hrs > 0 || initialTotalSeconds >= 3600) {
        hrsPart.style.display = 'inline';
        colon1.style.display = 'inline';
        hrsPart.textContent = formatNumber(hrs);
      } else {
        hrsPart.style.display = 'none';
        colon1.style.display = 'none';
      }

      document.getElementById('minutesPart').textContent = formatNumber(mins);
      document.getElementById('secondsPart').textContent = formatNumber(secs);
    }

    function toggleTimer() {
      if (isRunning) {
        pauseTimer();
      } else {
        startTimer();
      }
    }

    function startTimer() {
      if (remainingSeconds <= 0) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      isRunning = true;
      document.body.classList.add('active');
      document.body.classList.remove('finished');
      document.getElementById('alertBanner').classList.remove('show');

      const startBtn = document.getElementById('startBtn');
      startBtn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
        <span>Pause</span>
      `;
      startBtn.classList.remove('btn-start');
      startBtn.classList.add('btn-pause');

      document.querySelectorAll('.colon').forEach(el => el.classList.remove('paused'));

      timerInterval = setInterval(() => {
        if (remainingSeconds > 0) {
          remainingSeconds--;
          updateDisplay();

          // Soft tick sound in last 5 seconds
          if (remainingSeconds > 0 && remainingSeconds <= 5) {
            playBeep(440, 0.08);
          }

          if (remainingSeconds === 0) {
            finishTimer();
          }
        }
      }, 1000);
    }

    function pauseTimer() {
      isRunning = false;
      clearInterval(timerInterval);
      document.body.classList.remove('active');

      const startBtn = document.getElementById('startBtn');
      startBtn.innerHTML = `
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="5 3 19 12 5 21 5 3"></polygon>
        </svg>
        <span>Resume</span>
      `;
      startBtn.classList.add('btn-start');
      startBtn.classList.remove('btn-pause');

      document.querySelectorAll('.colon').forEach(el => el.classList.add('paused'));
    }

    function resetTimer() {
      pauseTimer();
      remainingSeconds = initialTotalSeconds;
      document.body.classList.remove('finished');
      document.getElementById('alertBanner').classList.remove('show');
      document.getElementById('startBtn').querySelector('span').textContent = 'Start';
      updateDisplay();
    }

    function finishTimer() {
      pauseTimer();
      document.body.classList.add('finished');
      const banner = document.getElementById('alertBanner');
      banner.classList.add('show');
      playFinishAlarm();

      setTimeout(() => {
        banner.classList.remove('show');
      }, 6000);
    }

    function setPreset(mins) {
      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active-preset'));
      if (event && event.target) {
        event.target.classList.add('active-preset');
      }
      initialTotalSeconds = mins * 60;
      remainingSeconds = initialTotalSeconds;
      pauseTimer();
      document.getElementById('startBtn').querySelector('span').textContent = 'Start';
      updateDisplay();
    }

    function openEditModal() {
      if (isRunning) pauseTimer();
      const hrs = Math.floor(initialTotalSeconds / 3600);
      const mins = Math.floor((initialTotalSeconds % 3600) / 60);
      const secs = initialTotalSeconds % 60;

      document.getElementById('inHours').value = hrs;
      document.getElementById('inMinutes').value = mins;
      document.getElementById('inSeconds').value = secs;

      document.getElementById('editModal').classList.add('open');
      document.getElementById('inMinutes').focus();
      document.getElementById('inMinutes').select();
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('open');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'editModal') {
        closeEditModal();
      }
    }

    function saveCustomTime() {
      const hrs = Math.max(0, parseInt(document.getElementById('inHours').value) || 0);
      const mins = Math.max(0, parseInt(document.getElementById('inMinutes').value) || 0);
      const secs = Math.max(0, parseInt(document.getElementById('inSeconds').value) || 0);

      const total = hrs * 3600 + mins * 60 + secs;
      if (total <= 0) {
        alert("Kripya 0 se adhik samay enter karein.");
        return;
      }

      document.querySelectorAll('.preset-btn').forEach(btn => btn.classList.remove('active-preset'));
      initialTotalSeconds = total;
      remainingSeconds = total;
      closeEditModal();
      resetTimer();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const icon = document.getElementById('soundIcon');
      if (soundEnabled) {
        icon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        `;
      } else {
        icon.innerHTML = `
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        `;
      }
    }

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (document.getElementById('editModal').classList.contains('open')) {
        if (e.key === 'Enter') saveCustomTime();
        if (e.key === 'Escape') closeEditModal();
        return;
      }

      if (e.code === 'Space') {
        e.preventDefault();
        toggleTimer();
      } else if (e.key === 'r' || e.key === 'R') {
        resetTimer();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'e' || e.key === 'E') {
        openEditModal();
      }
    });

    // Initialize display
    updateDisplay();
  </script>
</body>
</html>
